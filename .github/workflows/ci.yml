name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # the failure-log step commits the log tail to the repo
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cxx: g++-13,  cc: gcc-13 }
          - { os: ubuntu-latest,  cxx: clang++-18, cc: clang-18 }
          - { os: macos-latest,   cxx: clang++,  cc: clang }
          - { os: windows-latest, cxx: cl,       cc: cl }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # the failure-log step needs a pushable history

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMCP_BUILD_TESTS=ON -DMCP_BUILD_EXAMPLES=ON

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMCP_BUILD_TESTS=ON -DMCP_BUILD_EXAMPLES=ON

      # tee'd so a failure-log step can attach the tail to the repo (compiler
      # logs are otherwise unreadable without GitHub authentication).
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then CFG="--config RelWithDebInfo"; fi
          cmake --build build $CFG -j 4 2>&1 | tee ci-build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure -C RelWithDebInfo

      - name: Persist failure log
        if: failure()
        shell: bash
        env:
          # Unique per job: concurrent failures must not push the same path.
          LOG_NAME: ci-failure-${{ runner.os }}-${{ matrix.cxx }}.log
        run: |
          git config user.name "ci-log-bot"
          git config user.email "actions@users.noreply.github.com"
          tail -c 300000 ci-build.log > "$LOG_NAME" || true
          git add "$LOG_NAME"
          git commit -m "ci: attach ${RUNNER_OS}/${RUNNER_ARCH} failure log for run ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

  # B1: the headers must also compile as C++23 (std::expected path in
  # error.hpp; consumers set their own standard, so it is not ours to choose).
  cxx23:
    name: ubuntu / C++23 headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-std=c++23 -Werror"
          -DMCP_BUILD_TESTS=ON -DMCP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # P0-3 / P0-4: the package must be usable through find_package() alone.
  # Configure + install, then build tests/consumer (which uses the HTTP
  # transport, so ws2_32/Threads must be in the exported target).
  install-consumer:
    name: ubuntu / install + consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure + build
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMCP_BUILD_TESTS=OFF -DMCP_BUILD_EXAMPLES=OFF
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
      - run: cmake --build build -j 4
      - run: cmake --install build
      - name: Check the package version
        run: |
          # The real version assertion lives in mcp_test_version (against
          # version.txt); here a well-formed version line is enough, so the
          # job stops breaking on every release bump.
          grep -qE 'PACKAGE_VERSION "[0-9]+\.[0-9]+\.[0-9]+"' install/lib/cmake/mcp/mcpConfigVersion.cmake
      - name: Build and run the consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build build-consumer -j 4
          ctest --test-dir build-consumer --output-on-failure

  # P0-1 acceptance: concurrent POSTs must be race-free. The server suite
  # drives processLine from 16 threads and the HTTP e2e suite from 64.
  tsan:
    name: ubuntu / TSan (server + HTTP)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the failure-log step commits the log tail to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMCP_BUILD_EXAMPLES=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build build -j 4
      - name: Test (dispatch concurrency)
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure \
            -R "mcp_test_server|mcp_test_http_e2e" 2>&1 | tee ci-test.log
      - name: Persist failure log
        if: failure()
        shell: bash
        env:
          LOG_NAME: ci-failure-TSan.log
        run: |
          git config user.name "ci-log-bot"
          git config user.email "actions@users.noreply.github.com"
          tail -c 300000 ci-test.log > "$LOG_NAME" || true
          git add "$LOG_NAME"
          git commit -m "ci: attach TSan failure log for run ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

  # Beyond Tier 1: dispatch concurrency is a compile-time choice (MCP_WORKERS).
  # Four slots must let handlers overlap while the shared server state stays
  # race-free; run the suites that exercise concurrent dispatch.
  workers:
    name: ubuntu / MCP_WORKERS=4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMCP_WORKERS=4
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure
          -R "mcp_test_server|mcp_test_http_e2e|mcp_test_tasks"

  # C3: the pure-stdio configure (MCP_DISABLE_HTTP=ON) must build and its
  # stdio-only tests must pass - and nothing may name the HTTP-only targets
  # unconditionally (that broke this mode once already, see P0 round).
  stdio-only:
    name: ubuntu / pure stdio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMCP_DISABLE_HTTP=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Doxygen API reference: the generated HTML is uploaded as an artifact so
  # reviewers can browse the public API without checking the repo out.
  docs:
    name: ubuntu / Doxygen API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate
        run: doxygen Doxyfile
      - name: Check the reference is non-trivial
        run: test -f build-docs/html/index.html && test "$(grep -c '<tr' build-docs/html/index.html)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: build-docs/html/
          retention-days: 14

  sanitizers:
    name: ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Runs the official conformance suite against examples/conformance_server.cpp.
  # The four server-initiated-request scenarios are baselined in
  # conformance/expected-failures.yaml (see docs/CONFORMANCE.md); any OTHER
  # failure fails the job, so regressions are caught.
  conformance:
    name: conformance (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure + build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: Start fixture server
        run: |
          ./bin/conformance_server --port 8099 &
          # The endpoint answers GET with 405 (POST-only transport), so probe
          # with curl -f off and accept 405 as "ready".
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/mcp || true)
            if [ "$code" = "405" ] || [ "$code" = "200" ]; then break; fi
            sleep 1
          done
      - name: Run conformance suite
        run: |
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 server \
            --url http://127.0.0.1:8099/mcp \
            --expected-failures conformance/expected-failures.yaml \
            -o conformance/out
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance/out

  # Client mode: the harness starts its own scenario servers and drives OUR
  # client (examples/conformance_client.cpp). This covers the whole required
  # client set for both revisions, including the 25 auth/* OAuth 2.1 + CIMD
  # scenarios. `--suite all` matches how the official rust-sdk runs its
  # reference client.
  conformance-client:
    name: conformance (client)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec-version: ["2025-11-25", "2026-07-28"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure + build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: Run client scenarios
        run: |
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 client \
            --command "bin/conformance_client" \
            --suite all \
            --spec-version "${{ matrix.spec-version }}" \
            --expected-failures conformance/expected-failures.yaml \
            -o "conformance/out-client-${{ matrix.spec-version }}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-client-report-${{ matrix.spec-version }}
          path: conformance/out-client-*
