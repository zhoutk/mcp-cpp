name: Bug report
description: Something isn't working
title: "[bug] "
labels: ["bug", "needs repro"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues, do not use this form —
        see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code or wire messages that reproduce it. A failing test is ideal.
      render: cpp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-cpp version / commit
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Compiler, standard library, OS
      placeholder: "clang 22.1.8 / libc++ / MSYS2 clang64 / Windows 11"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - Streamable HTTP
        - other / not applicable
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
    validations:
      required: false
