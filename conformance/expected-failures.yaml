# Conformance expected-failures baseline.
#
# Pass with:
#   npx @modelcontextprotocol/conformance server --url http://127.0.0.1:8099/mcp \
#     --expected-failures conformance/expected-failures.yaml
#   npx @modelcontextprotocol/conformance client --command bin/conformance_client \
#     --scenario <s> --expected-failures conformance/expected-failures.yaml
#
# Every entry is a scenario mcp-cpp knowingly does not pass. Keep this list
# small and shrinking; each entry needs a reason.
#
# Server suite, 2026-07-28 (suite 0.2.0-alpha.12): 42/42 checks, 20/20 scenarios - 100%.
# Server suite, 2025-11-25 (suite v0.1.16): 26/30.
# Client suite, 2025-11-25: initialize, tools_call, sse-retry, elicitation pass
# (see the elicitation/sse-retry notes below); auth/* does not (no OAuth yet).
server:
  - tools-call-sampling          # server->client sampling/createMessage (2025 mechanism;
                                 #   2026-07-28 replaced it with MRTR, which mcp-cpp implements)
  - tools-call-elicitation       # server->client elicitation/create (same)
  - elicitation-sep1034-defaults # server->client elicitation/create (defaults; same)
  - elicitation-sep1330-enums    # server->client elicitation/create (enums; same)
  # Not a real failure: this 2025-only scenario drives the GET SSE stream, which
  # 2026-07-28 removed (GET returns 405). The suite runs it but records zero
  # checks, and the baseline gate treats a non-passing scenario as unexpected.
  - server-sse-multiple-streams
client:
  # OAuth 2.1 / Client ID Metadata Documents are not implemented yet (ROADMAP,
  # Milestone C). All auth scenarios are therefore expected failures until then.
  - auth/metadata-default
  - auth/metadata-var1
  - auth/metadata-var2
  - auth/metadata-var3
  - auth/basic-cimd
  - auth/scope-from-www-authenticate
  - auth/scope-from-scopes-supported
  - auth/scope-omitted-when-undefined
  - auth/scope-step-up
  - auth/scope-retry-limit
  - auth/token-endpoint-auth-basic
  - auth/token-endpoint-auth-post
  - auth/token-endpoint-auth-none
  - auth/pre-registration
  - auth/2025-03-26-oauth-metadata-backcompat
  - auth/2025-03-26-oauth-endpoint-fallback
  - auth/resource-mismatch
  - auth/offline-access-scope
  - auth/offline-access-not-supported
  - auth/authorization-server-migration
  - auth/iss-supported
  - auth/iss-not-advertised
  - auth/iss-supported-missing
  - auth/iss-wrong-issuer
  - auth/iss-unexpected
  - auth/iss-normalized
  - auth/metadata-issuer-mismatch
  - auth/client-credentials-jwt
  - auth/client-credentials-basic
  - auth/enterprise-managed-authorization
  - auth/dpop
  - auth/dpop-nonce
  - auth/wif-jwt-bearer
  - auth/cross-app-access-complete-flow
  # Flaky under the harness on Windows, NOT an SDK defect: the scenario passes
  # standalone intermittently, and the official rust-sdk reference client fails
  # it consistently in the same environment (0/5 x3, verified 2026-10-14) - the
  # mock's GET-stream session routing races the client's listener setup.
  - elicitation-sep1034-client-defaults
  - sse-retry
  # Same harness-environment flake: the official rust-sdk reference client
  # fails it identically here (0/5, verified 2026-10-14); mcp-cpp passes it
  # intermittently. The scenario probes SEP-2322 requestState wire shapes
  # server-side; our client echoes requestState per spec (unit-tested).
  - sep-2322-client-request-state
